<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>ZUGO: الهروب الأخير</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{width:100%;height:100%;overflow:hidden;background:#0b0f1f;
    font-family:'Segoe UI',Tahoma,'Noto Sans Arabic',sans-serif;touch-action:none;}
  #game{position:fixed;inset:0;display:block;background:#0b0f1f;}
  .hint{position:fixed;top:92px;left:50%;transform:translateX(-50%);
    color:#9fb3ff;font-size:12px;opacity:.75;z-index:10;pointer-events:none;text-align:center;width:90%;}
  .controls{position:fixed;left:0;right:0;bottom:env(safe-area-inset-bottom,12px);
    padding:0 16px 16px;display:flex;justify-content:space-between;align-items:flex-end;
    pointer-events:none;z-index:10;}
  .cluster{display:flex;gap:12px;align-items:flex-end;pointer-events:auto;}
  .left{flex-direction:column;align-items:flex-start;}
  .right{display:grid;grid-template-columns:repeat(2,62px);gap:10px;justify-content:flex-end;}
  .btn{width:66px;height:66px;border-radius:18px;border:2px solid rgba(255,255,255,.25);
    background:rgba(255,255,255,.08);color:#fff;font-size:28px;display:flex;align-items:center;
    justify-content:center;user-select:none;backdrop-filter:blur(4px);
    box-shadow:0 4px 14px rgba(0,0,0,.45);transition:transform .05s,background .05s;}
  .btn:active{transform:scale(.9);background:rgba(255,255,255,.24);}
  .btn.small{width:58px;height:58px;font-size:24px;}
  #btn-cloak{border-color:rgba(160,120,255,.8);}
  #btn-morph{border-color:rgba(255,180,90,.8);}
  #btn-gravity{border-color:rgba(120,255,200,.8);}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div class="hint">اسحب للحركة · انقر للقفز · استخدم القدرات لتجاوز البشر وجمع أجزاء السفينة</div>
<div class="controls">
  <div class="cluster left">
    <div class="btn" id="btn-left">&#9664;</div>
    <div class="btn" id="btn-right">&#9654;</div>
  </div>
  <div class="cluster right">
    <div class="btn small" id="btn-jump">&#10514;</div>
    <div class="btn small" id="btn-cloak">&#128123;</div>
    <div class="btn small" id="btn-morph">&#129504;</div>
    <div class="btn small" id="btn-gravity">&#128255;</div>
  </div>
</div>
<script src="src/utils.js"></script>
<script src="src/input.js"></script>
<script src="src/entities.js"></script>
<script src="src/level.js"></script>
<script src="src/game.js"></script>
<script>
  function img(s){var i=new Image();i.crossOrigin='anonymous';i.src=s;return i;}
  window.ASSETS = {
    bg: img('assets/bg_temple.png'),
    ruins: img('assets/bg_ruins.png'),
    crystal: img('assets/prop_crystal.png'),
    alien: img('assets/char_alien.png'),
    guardian: img('assets/char_guardian.png'),
    sentry: img('assets/char_sentry.png')
  };
  window.addEventListener('load', function(){
    var g = new Game(document.getElementById('game'));
    window.__game = g;
  });
</script>
</body>
</html>
