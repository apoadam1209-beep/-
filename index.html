<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <title>جُمان! — انفجِر الجواهر</title>
    <meta name="description" content="جُمان! لعبة كرتونية مُدمِنة من ١٠٠ مرحلة: اضغط مجموعات الجواهر المبتسمة لتنفجر بنقاط وكومبو وقنابل." />
    <meta name="theme-color" content="#201c40" />
    <script>
      if ("serviceWorker" in navigator) navigator.serviceWorker.getRegistrations().then(function (r) { r.forEach(function (x) { x.unregister(); }); });
      if ("caches" in window) caches.keys().then(function (k) { k.forEach(function (c) { caches.delete(c); }); });
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="bg" aria-hidden="true"><i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i></div>
    <div id="wrap">
      <header class="top">
        <div class="logo">جُمان<span>!</span></div>
        <button class="btn round sound" id="btn-sound" title="الصوت">♪</button>
      </header>

      <div class="hud">
        <div class="stat"><span class="k">المرحلة</span><span class="v lvl" id="hud-level">١/١٠٠</span></div>
        <div class="stat grow">
          <span class="k">النقاط <i id="hud-score">0</i> / <i id="hud-target">0</i></span>
          <div class="bar"><div id="bar-fill"></div></div>
        </div>
        <div class="stat"><span class="k">حركات</span><span class="v moves" id="hud-moves">٠</span></div>
      </div>

      <div class="board"><canvas id="cv"></canvas></div>

      <p class="hint">اضغط على جَوْهَرَين متشابهتين أو أكثر لتفرقعها · مجموعة كبيرة = قنبلة 💣</p>
    </div>

    <div class="ov" id="ov-start">
      <div class="panel">
        <div class="gem-row" aria-hidden="true">
          <i class="g g1"></i><i class="g g2"></i><i class="g g3"></i><i class="g g4"></i><i class="g g5"></i>
        </div>
        <div class="title">جُمان<span>!</span></div>
        <p class="sub">انفجِر الجواهر المبتسمة · اجمع الكومبو · اصنع القنابل</p>
        <p class="best" id="best-line"></p>
        <div class="settings">
          <div class="setrow">
            <span class="setlabel">درجة الصعوبة</span>
            <div class="seg" id="seg-diff" role="group" aria-label="الصعوبة">
              <button data-d="easy">سهل</button>
              <button data-d="normal" class="on">عادي</button>
              <button data-d="hard">صعب</button>
            </div>
          </div>
          <div class="setrow">
            <span class="setlabel">الصوت</span>
            <button class="btn mini" id="sw-sound">♪ الصوت مفعّل</button>
          </div>
        </div>
        <button class="btn big primary" id="btn-start">▶ ابدأ لعبة جديدة</button>
        <button class="btn big" id="btn-continue">أكمل تقدّمك</button>
      </div>
    </div>

    <div class="ov hidden" id="ov-win">
      <div class="panel">
        <div class="title win" id="win-title">أحسنت!</div>
        <div class="stars" id="win-stars">★★★</div>
        <p class="sub" id="win-sub"></p>
        <button class="btn big primary" id="btn-next">المرحلة التالية ◀</button>
        <div class="row"><button class="btn" id="btn-again-win">إعادة</button><button class="btn ghost" id="btn-menu">القائمة</button></div>
      </div>
    </div>

    <div class="ov hidden" id="ov-lose">
      <div class="panel">
        <div class="title lose">انتهت الحركات!</div>
        <p class="sub">جمعت <b id="lose-score">0</b> من <b id="lose-target">0</b>. حاول مجدداً!</p>
        <button class="btn big primary" id="btn-retry">🔁 حاول مجدداً</button>
        <div class="row"><button class="btn ghost" id="btn-menu2">القائمة</button></div>
      </div>
    </div>

    <div class="confetti" id="confetti"></div>

    <script src="pop.js"></script>
    <script>document.getElementById("btn-menu2").addEventListener("click",function(){location.reload();});</script>
  </body>
</html>
