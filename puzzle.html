<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>ZUGO: أصلح السفينة</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{width:100%;height:100%;overflow:hidden;background:#05060c;
    font-family:'Segoe UI',Tahoma,'Noto Sans Arabic',sans-serif;touch-action:none;}
  #game{position:fixed;inset:0;display:block;background:#05060c;}
  .hint{position:fixed;top:8px;left:50%;transform:translateX(-50%);
    color:#bfe7ff;font-size:12px;opacity:.85;z-index:10;pointer-events:none;text-align:center;width:94%;}
  .controls{position:fixed;left:0;right:0;bottom:env(safe-area-inset-bottom,14px);
    padding:0 16px 16px;display:flex;justify-content:center;z-index:10;}
  .btn{height:54px;min-width:150px;border-radius:16px;border:2px solid rgba(120,200,255,.5);
    background:rgba(20,30,55,.7);color:#fff;font-size:16px;display:flex;align-items:center;justify-content:center;
    user-select:none;backdrop-filter:blur(4px);box-shadow:0 4px 14px rgba(0,0,0,.45);}
  .btn:active{transform:scale(.94);background:rgba(40,60,100,.8);}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div class="hint" id="hint">اضغط على أي قطعة لتدويرها وصل الطاقة الخضراء بالقلب الذهبي</div>
<div class="controls">
  <div class="btn" id="btn-reset">↻ إعادة المحاولة</div>
</div>
<script>
/* ===== أدوات ===== */
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function setEq(a,b){if(a.length!==b.length)return false;a=a.slice().sort();b=b.slice().sort();for(var i=0;i<a.length;i++)if(a[i]!==b[i])return false;return true;}
var BASE={straight:[0,2],corner:[0,1],tee:[0,1,2],cross:[0,1,2,3]};
var DR=[-1,0,1,0], DC=[0,1,0,-1];
function dirTo(a,b){if(b.r===a.r-1)return 0;if(b.c===a.c+1)return 1;if(b.r===a.r+1)return 2;return 3;}
function conns(cell){ if(cell.type==='node') return [cell.dir]; return BASE[cell.type].map(function(d){return (d+cell.rot)%4;}); }

/* ===== الغرفة 1: توصيل الدائرة ===== */
function buildLevel(R,C){
  var sr=Math.floor(Math.random()*R), sc=0, er=Math.floor(Math.random()*R), ec=C-1;
  var visited=Array.from({length:R},function(){return Array(C).fill(false);});
  var path=[];
  function dfs(r,c){
    visited[r][c]=true; path.push({r:r,c:c});
    if(r===er&&c===ec) return true;
    var ds=shuffle([0,1,2,3]);
    for(var k=0;k<4;k++){var d=ds[k],nr=r+DR[d],nc=c+DC[d];
      if(nr>=0&&nr<R&&nc>=0&&nc<C&&!visited[nr][nc]){ if(dfs(nr,nc)) return true; }}
    path.pop(); visited[r][c]=false; return false;
  }
  dfs(sr,sc);
  var grid=[];
  for(var r=0;r<R;r++){var row=[];for(var c=0;c<C;c++)row.push({type:'empty',rot:0,fixed:false});grid.push(row);}
  function setCell(r,c,type,dirs){
    var cell=grid[r][c]; cell.type=type;
    if(type==='node'){ cell.dir=dirs[0]; cell.fixed=true; cell.rot=0; }
    else{ var base=BASE[type],sol=-1;
      for(var rt=0;rt<4;rt++){ if(setEq(base.map(function(d){return (d+rt)%4;}),dirs)){sol=rt;break;} }
      cell.solRot=sol<0?0:sol; cell.rot=shuffle([0,1,2,3].filter(function(x){return x!==cell.solRot;}))[0]; cell.fixed=false; }
  }
  for(var i=0;i<path.length;i++){ var cur=path[i],dirs=[];
    if(i>0) dirs.push(dirTo(cur,path[i-1]));
    if(i<path.length-1) dirs.push(dirTo(cur,path[i+1]));
    if(dirs.length===2){ var t=((dirs[0]+2)%4===dirs[1])?'straight':'corner'; setCell(cur.r,cur.c,t,dirs); }
    else setCell(cur.r,cur.c,'node',dirs);
  }
  for(var r2=0;r2<R;r2++)for(var c2=0;c2<C;c2++){ var cl=grid[r2][c2];
    if(cl.type==='empty'&&Math.random()<0.62){ var ts=['straight','corner','corner','tee']; cl.type=ts[Math.floor(Math.random()*ts.length)]; cl.rot=Math.floor(Math.random()*4); } }
  grid[er][ec].type='node'; grid[er][ec].dir=dirTo(grid[er][ec],path[path.length-2]); grid[er][ec].fixed=true;
  return {R:R,C:C,grid:grid,src:{r:sr,c:sc},sink:{r:er,c:ec}};
}
function scramble(L){ for(var r=0;r<L.R;r++)for(var c=0;c<L.C;c++){var cell=L.grid[r][c]; if(cell.type!=='empty'&&!cell.fixed&&cell.type!=='node') cell.rot=Math.floor(Math.random()*4);} }
function bfs(L){
  var R=L.R,C=L.C, pow=Array.from({length:R},function(){return Array(C).fill(false);});
  var q=[L.src]; pow[L.src.r][L.src.c]=true;
  while(q.length){ var cur=q.shift(), cell=L.grid[cur.r][cur.c], cs=conns(cell);
    for(var i=0;i<cs.length;i++){ var d=cs[i], nr=cur.r+DR[d], nc=cur.c+DC[d];
      if(nr<0||nr>=R||nc<0||nc>=C||pow[nr][nc]) continue;
      var nb=L.grid[nr][nc]; if(nb.type==='empty') continue;
      if(conns(nb).indexOf((d+2)%4)>=0){ pow[nr][nc]=true; q.push({r:nr,c:nc}); } } }
  return pow;
}

/* ===== اللعبة ===== */
class Game {
  constructor(canvas){
    this.canvas=canvas; this.ctx=canvas.getContext('2d');
    this.W=0;this.H=0;this.dpr=1;this.state='title';this.time=0;
    this.room=0; this.roomSolved=false; this.solvedT=0;
    this.rooms=['أصلح الدائرة','افتح قفل الرموز','اصطف الحلقات'];
    this.circuit=null; this.lock=null; this.rings=null;
    var self=this;
    this._resize(); window.addEventListener('resize',function(){self._resize();});
    canvas.addEventListener('pointerdown',function(e){self._onTap(e);});
    document.getElementById('btn-reset').addEventListener('pointerdown',function(e){e.preventDefault();self._resetRoom();});
    this.last=performance.now(); requestAnimationFrame(function(t){self._frame(t);});
  }
  _resize(){ var w=window.innerWidth,h=window.innerHeight; this.dpr=Math.min(window.devicePixelRatio||1,2);
    this.canvas.width=Math.floor(w*this.dpr); this.canvas.height=Math.floor(h*this.dpr);
    this.canvas.style.width=w+'px'; this.canvas.style.height=h+'px'; this.W=w; this.H=h; }
  start(){ this.room=0; this.initRoom(); this.state='play'; }
  advance(){ this.room++; if(this.room>=3){ this.state='win'; } else { this.initRoom(); } }
  initRoom(){
    this.roomSolved=false;
    var hints=[
      'اضغط القطع لتدويرها وصل الطاقة الخضراء بالقلب الذهبي',
      'احفظ ترتيب الرموز ثم أعِد إدخاله بالضغط عليها',
      'أدِر الحلقات بتكرار الضغط حتى تَصطف الفجوات كلها لأعلى'
    ];
    document.getElementById('hint').textContent = hints[this.room];
    if(this.room===0){ this.circuit=buildLevel(3+this._lvl(),3+this._lvl()); }
    else if(this.room===1){ var L=3+Math.floor(Math.random()*3); var s=[]; for(var i=0;i<L;i++) s.push(Math.floor(Math.random()*5)); this.lock={seq:s,input:[],phase:'show',showIdx:0,timer:0,wrong:0}; }
    else { var n=3; var p=[]; for(var k=0;k<n;k++) p.push(Math.floor(Math.random()*12)); this.rings={n:n,pos:p,seg:12}; }
  }
  _lvl(){ return this.room; } // 0,1,2 → أحجام 3,4,5
  _resetRoom(){
    if(this.room===0 && this.circuit) scramble(this.circuit);
    else if(this.room===1 && this.lock){ var L=3+Math.floor(Math.random()*3); var s=[]; for(var i=0;i<L;i++) s.push(Math.floor(Math.random()*5)); this.lock={seq:s,input:[],phase:'show',showIdx:0,timer:0,wrong:0}; }
    else if(this.rings){ for(var k=0;k<this.rings.n;k++) this.rings.pos[k]=Math.floor(Math.random()*12); }
  }
  _frame(now){var dt=(now-this.last)/1000;this.last=now;if(dt>0.05)dt=0.05;this.time+=dt;this.update();this.render();var s=this;requestAnimationFrame(function(t){s._frame(t);});}
  update(){
    if(this.state!=='play') return;
    if(this.roomSolved){ if(this.time-this.solvedT>0.9) this.advance(); return; }
    if(this.room===0){
      if(this.circuit && bfs(this.circuit)[this.circuit.sink.r][this.circuit.sink.c]){ this.roomSolved=true; this.solvedT=this.time; }
    } else if(this.room===1){
      var lk=this.lock;
      if(lk.phase==='show'){ lk.timer+=1/60; if(lk.timer>0.55){ lk.timer=0; lk.showIdx++; if(lk.showIdx>=lk.seq.length) lk.phase='input'; } }
      if(lk.wrong>0) lk.wrong-=1/60;
    } else if(this.room===2){
      var all0=true; for(var k=0;k<this.rings.n;k++) if(this.rings.pos[k]!==0) all0=false;
      if(all0){ this.roomSolved=true; this.solvedT=this.time; }
    }
  }
  _onTap(e){
    if(this.state==='title'){ this.start(); return; }
    if(this.state==='win'){ this.state='title'; return; }
    if(this.roomSolved) return;
    var rect=this.canvas.getBoundingClientRect(); var px=e.clientX-rect.left, py=e.clientY-rect.top;
    if(this.room===0) this._tapCircuit(px,py);
    else if(this.room===1) this._tapLock(px,py);
    else if(this.room===2) this._tapRings(px,py);
  }
  _tapCircuit(px,py){
    var L=this.circuit, g=this._gridGeom(), c=Math.floor((px-g.x)/g.cs), r=Math.floor((py-g.y)/g.cs);
    if(r<0||r>=L.R||c<0||c>=L.C) return; var cell=L.grid[r][c];
    if(cell.type!=='empty'&&!cell.fixed&&cell.type!=='node') cell.rot=(cell.rot+1)%4;
  }
  _tapLock(px,py){
    var lk=this.lock; if(lk.phase!=='input') return;
    var gm=this._lockGeom();
    for(var i=0;i<5;i++){ var b=gm.btns[i];
      if(px>=b.x&&px<=b.x+b.s&&py>=b.y&&py<=b.y+b.s){
        if(i===lk.seq[lk.input.length]){ lk.input.push(i); if(lk.input.length===lk.seq.length){ this.roomSolved=true; this.solvedT=this.time; } }
        else { lk.wrong=0.5; lk.input=[]; }
        return;
      } }
  }
  _tapRings(px,py){
    var g=this._ringGeom(); var dx=px-g.cx, dy=py-g.cy, dist=Math.hypot(dx,dy);
    var idx=-1;
    if(dist<=g.r3&&dist>g.r2) idx=2; else if(dist<=g.r2&&dist>g.r1) idx=1; else if(dist<=g.r1) idx=0; else return;
    this.rings.pos[idx]=(this.rings.pos[idx]+1)%this.rings.seg;
  }
  _gridGeom(){ var L=this.circuit, pad=20;
    var cs=Math.min((this.W-pad*2)/L.C,(this.H*0.6)/L.R);
    var gw=cs*L.C, gh=cs*L.R; return {x:(this.W-gw)/2,y:(this.H-gh)/2+this.H*0.05,cs:cs}; }
  _lockGeom(){ var s=Math.min(this.W*0.16,90), gap=14, total=5*s+4*gap, x0=(this.W-total)/2, y=this.H*0.42;
    var btns=[]; for(var i=0;i<5;i++) btns.push({x:x0+i*(s+gap),y:y,s:s}); return {btns:s,cy:y+s/2}; }
  _ringGeom(){ var R=Math.min(this.W,this.H)*0.34; return {cx:this.W/2,cy:this.H*0.46,r1:R*0.42,r2:R*0.7,r3:R}; }

  /* ===================== الرسم ===================== */
  render(){
    var ctx=this.ctx,W=this.W,H=this.H; ctx.setTransform(this.dpr,0,0,this.dpr,0,0); ctx.clearRect(0,0,W,H);
    this._bg(ctx);
    if(this.state==='title'){ this._title(ctx); return; }
    if(this.state==='win'){ this._win(ctx); return; }
    if(this.room===0) this._drawCircuit(ctx);
    else if(this.room===1) this._drawLock(ctx);
    else this._drawRings(ctx);
    // HUD
    ctx.fillStyle='rgba(6,10,22,0.6)'; ctx.fillRect(0,0,W,46);
    ctx.fillStyle='#bfe7ff'; ctx.font='bold 18px sans-serif'; ctx.textAlign='center';
    ctx.fillText('الغرفة '+(this.room+1)+' / 3 — '+this.rooms[this.room], W/2, 30);
    ctx.textAlign='left';
    if(this.roomSolved){ ctx.fillStyle='rgba(120,255,180,0.9)'; ctx.font='bold 30px sans-serif'; ctx.textAlign='center'; ctx.fillText('✓ تم!',W/2,H*0.5); ctx.textAlign='left'; }
  }
  _drawCircuit(ctx){
    var g=this._gridGeom(),L=this.circuit, pow=bfs(L);
    ctx.fillStyle='rgba(8,12,24,0.55)'; this._rr(ctx,g.x-10,g.y-10,g.cs*L.C+20,g.cs*L.R+20,14); ctx.fill();
    for(var r=0;r<L.R;r++)for(var c=0;c<L.C;c++){ var cell=L.grid[r][c];
      var cx=g.x+c*g.cs+g.cs/2, cy=g.y+r*g.cs+g.cs/2;
      ctx.fillStyle='rgba(255,255,255,0.04)'; this._rr(ctx,g.x+c*g.cs+3,g.y+r*g.cs+3,g.cs-6,g.cs-6,8); ctx.fill();
      if(cell.type==='empty') continue;
      this._drawPipe(ctx,cx,cy,g.cs,cell,pow[r][c],L,r,c);
    }
  }
  _drawPipe(ctx,cx,cy,cs,cell,lit,L,r,c){
    var cs2=conns(cell);
    function seg(x,y,d){ return [x,y,x+DC[d]*cs/2,y+DR[d]*cs/2]; }
    // قاعدة معدنية
    ctx.lineCap='round'; ctx.lineWidth=cs*0.30; ctx.strokeStyle= lit?'#0c3340':'rgba(36,42,58,0.95)';
    if(lit){ ctx.shadowColor='#39e0ff'; ctx.shadowBlur=14; }
    for(var i=0;i<cs2.length;i++){ var s=seg(cx,cy,cs2[i]); ctx.beginPath(); ctx.moveTo(s[0],s[1]); ctx.lineTo(s[2],s[3]); ctx.stroke(); }
    ctx.shadowBlur=0;
    // لمعان علوي
    ctx.lineWidth=cs*0.14; ctx.strokeStyle= lit?'#9ff4ff':'#7c869c';
    for(var j=0;j<cs2.length;j++){ var s2=seg(cx,cy,cs2[j]); ctx.beginPath(); ctx.moveTo(s2[0],s2[1]); ctx.lineTo(s2[2],s2[3]); ctx.stroke(); }
    if(cell.type==='node'){
      var isSrc=(r===L.src.r&&c===L.src.c);
      var col=isSrc?'#39ff9e':'#ffd24a';
      var gr=ctx.createRadialGradient(cx,cy,2,cx,cy,cs*0.3); gr.addColorStop(0,col); gr.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=gr; ctx.beginPath(); ctx.arc(cx,cy,cs*0.26,0,7); ctx.fill();
      ctx.fillStyle=col; ctx.beginPath(); ctx.arc(cx,cy,cs*0.13,0,7); ctx.fill();
    }
  }
  _drawGlyph(ctx,x,y,s,idx,col){
    ctx.save(); ctx.translate(x,y); ctx.fillStyle=col; ctx.strokeStyle=col; ctx.lineWidth=s*0.12; ctx.lineJoin='round';
    if(idx===0){ ctx.beginPath(); ctx.arc(0,0,s*0.32,0,7); ctx.fill(); }
    else if(idx===1){ ctx.beginPath(); ctx.moveTo(0,-s*0.34); ctx.lineTo(s*0.32,s*0.26); ctx.lineTo(-s*0.32,s*0.26); ctx.closePath(); ctx.fill(); }
    else if(idx===2){ ctx.fillRect(-s*0.3,-s*0.3,s*0.6,s*0.6); }
    else if(idx===3){ this._star(ctx,0,0,s*0.36,5); ctx.fill(); }
    else { ctx.beginPath(); ctx.moveTo(0,-s*0.34); ctx.lineTo(s*0.34,0); ctx.lineTo(0,s*0.34); ctx.lineTo(-s*0.34,0); ctx.closePath(); ctx.fill(); }
    ctx.restore();
  }
  _star(ctx,cx,cy,R,n){ ctx.beginPath(); for(var i=0;i<n*2;i++){ var ang=-Math.PI/2+i*Math.PI/n; var rad=(i%2===0)?R:R*0.45; var x=cx+Math.cos(ang)*rad,y=cy+Math.sin(ang)*rad; if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);} ctx.closePath(); }
  _drawLock(ctx){
    var lk=this.lock, gm=this._lockGeom();
    // منطقة التلميح
    ctx.textAlign='center'; ctx.fillStyle='#bfe7ff'; ctx.font='16px sans-serif';
    if(lk.phase==='show'){ ctx.fillText('احفظ الترتيب…',this.W/2,gm.cy-gm.s*0.9); }
    else { ctx.fillText('أدخِل الرموز ('+lk.input.length+'/'+lk.seq.length+')',this.W/2,gm.cy-gm.s*0.9); }
    for(var i=0;i<5;i++){ var b=gm.btns[i];
      var col='#7c869c', glow=false;
      if(lk.phase==='show'&&i===lk.seq[lk.showIdx]){ col='#39e0ff'; glow=true; }
      if(lk.phase==='input'&&lk.input.indexOf(i)>=0){ col='#39ff9e'; }
      if(lk.wrong>0){ col='#ff5a5a'; }
      ctx.fillStyle='rgba(10,16,30,0.7)'; this._rr(ctx,b.x,b.y,b.s,b.s,12); ctx.fill();
      ctx.strokeStyle='rgba(120,200,255,0.4)'; ctx.lineWidth=3; this._rr(ctx,b.x,b.y,b.s,b.s,12); ctx.stroke();
      if(glow){ ctx.save(); ctx.shadowColor='#39e0ff'; ctx.shadowBlur=20; }
      this._drawGlyph(ctx,b.x+b.s/2,b.y+b.s/2,b.s, i, col);
      if(glow) ctx.restore();
    }
    ctx.textAlign='left';
  }
  _drawRings(ctx){
    var g=this._ringGeom(), r=this.rings, seg=r.seg;
    ctx.textAlign='center'; ctx.fillStyle='#bfe7ff'; ctx.font='16px sans-serif';
    ctx.fillText('أدِر الحلقات حتى تَصطف الفجوات لأعلى',this.W/2,g.cy-g.r3-30); ctx.textAlign='left';
    var radii=[g.r1,g.r2,g.r3];
    for(var k=0;k<r.n;k++){ var rad=radii[k], ang=-Math.PI/2 + r.pos[k]*(2*Math.PI/seg);
      // حلقة باهتة
      ctx.strokeStyle='rgba(90,100,130,0.7)'; ctx.lineWidth=14; ctx.beginPath(); ctx.arc(g.cx,g.cy,rad,0,7); ctx.stroke();
      // الفجوة المتوهّجة
      ctx.save(); ctx.shadowColor='#39e0ff'; ctx.shadowBlur= (r.pos[k]===0)?22:10;
      ctx.strokeStyle=(r.pos[k]===0)?'#9ff4ff':'#39c8ff'; ctx.lineWidth=14; ctx.lineCap='round';
      ctx.beginPath(); ctx.arc(g.cx,g.cy,rad,ang-0.32,ang+0.32); ctx.stroke(); ctx.restore();
    }
    ctx.fillStyle='rgba(255,210,74,0.9)'; ctx.beginPath(); ctx.arc(g.cx,g.cy,8,0,7); ctx.fill();
  }
  _bg(ctx){
    var W=this.W,H=this.H;
    var g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#070a16'); g.addColorStop(0.6,'#0b1226'); g.addColorStop(1,'#0a0f1e');
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    ctx.strokeStyle='rgba(80,140,200,0.06)'; ctx.lineWidth=1; var st=46;
    for(var x=0;x<W;x+=st){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
    for(var y=0;y<H;y+=st){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
    ctx.save(); ctx.globalCompositeOperation='lighter';
    for(var i=0;i<5;i++){ var sx=(i*173.3)%W, sy=(i*97.7)%(H*0.6);
      var rg=ctx.createRadialGradient(sx,sy,2,sx,sy,90); rg.addColorStop(0,'rgba(60,160,200,0.10)'); rg.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=rg; ctx.fillRect(sx-90,sy-90,180,180); }
    ctx.restore();
  }
  _rr(ctx,x,y,w,h,r){r=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
  _title(ctx){ var W=this.W,H=this.H; ctx.fillStyle='rgba(4,6,12,0.78)'; ctx.fillRect(0,0,W,H);
    ctx.textAlign='center'; ctx.fillStyle='#9affc8'; ctx.font='bold 40px sans-serif'; ctx.fillText('ZUGO',W/2,H*0.30);
    ctx.fillStyle='#ffe9b0'; ctx.font='bold 22px sans-serif'; ctx.fillText('أصلح السفينة 🔧',W/2,H*0.30+34);
    ctx.fillStyle='#cbd'; ctx.font='15px sans-serif';
    this._wrap(ctx,'ثلاث غرف ألغاز لإصلاح سفينة زوغو والهروب من الأرض: وصّل الدائرة، افتح قفل الرموز، واصطف الحلقات.',W/2,H*0.46,W*0.82,22);
    var blink=0.5+0.5*Math.sin(this.time*4); ctx.globalAlpha=blink; ctx.fillStyle='#ffd24a'; ctx.font='bold 22px sans-serif';
    ctx.fillText('انقر للبدء',W/2,H*0.70); ctx.globalAlpha=1; ctx.textAlign='left'; }
  _win(ctx){ var W=this.W,H=this.H; ctx.fillStyle='rgba(5,20,10,0.82)'; ctx.fillRect(0,0,W,H);
    ctx.textAlign='center'; ctx.fillStyle='#9affc8'; ctx.font='bold 30px sans-serif'; ctx.fillText('أصلحت السفينة! 🛸',W/2,H*0.4);
    ctx.fillStyle='#fff'; ctx.font='17px sans-serif'; ctx.fillText('عاد زوغو إلى كوكبه بأمان',W/2,H*0.4+32);
    var blink=0.5+0.5*Math.sin(this.time*4); ctx.globalAlpha=blink; ctx.fillStyle='#fff'; ctx.font='bold 20px sans-serif';
    ctx.fillText('انقر للعبة جديدة',W/2,H*0.7); ctx.globalAlpha=1; ctx.textAlign='left'; }
  _wrap(ctx,text,x,y,maxW,lh){var words=text.split(' '),line='',yy=y;for(var i=0;i<words.length;i++){var t=line?line+' '+words[i]:words[i];if(ctx.measureText(t).width>maxW&&line){ctx.fillText(line,x,yy);line=words[i];yy+=lh;}else line=t;}ctx.fillText(line,x,yy);}
}
window.addEventListener('load',function(){ new Game(document.getElementById('game')); });
</script>
