<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>ZUGO: الهروب الأخير</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{width:100%;height:100%;overflow:hidden;background:#0b0f1f;
    font-family:'Segoe UI',Tahoma,'Noto Sans Arabic',sans-serif;touch-action:none;}
  #game{position:fixed;inset:0;display:block;background:#0b0f1f;}
  .hint{position:fixed;top:92px;left:50%;transform:translateX(-50%);
    color:#9fb3ff;font-size:12px;opacity:.75;z-index:10;pointer-events:none;text-align:center;width:90%;}
  .controls{position:fixed;left:0;right:0;bottom:env(safe-area-inset-bottom,12px);
    padding:0 16px 16px;display:flex;justify-content:space-between;align-items:flex-end;
    pointer-events:none;z-index:10;}
  .cluster{display:flex;gap:12px;align-items:flex-end;pointer-events:auto;}
  .btn{width:66px;height:66px;border-radius:18px;border:2px solid rgba(255,255,255,.25);
    background:rgba(255,255,255,.08);color:#fff;font-size:28px;display:flex;align-items:center;
    justify-content:center;user-select:none;backdrop-filter:blur(4px);
    box-shadow:0 4px 14px rgba(0,0,0,.45);transition:transform .05s,background .05s;}
  .btn:active{transform:scale(.9);background:rgba(255,255,255,.24);}
  .btn.small{width:58px;height:58px;font-size:24px;}
  #btn-cloak{border-color:rgba(160,120,255,.8);}
  #btn-morph{border-color:rgba(255,180,90,.8);}
  #btn-gravity{border-color:rgba(120,255,200,.8);}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div class="hint">اسحب للحركة · انقر للقفز · استخدم القدرات لتجاوز البشر وجمع أجزاء السفينة</div>
<div class="controls">
  <div class="cluster left">
    <div class="btn" id="btn-left">&#9664;</div>
    <div class="btn" id="btn-right">&#9654;</div>
    <div class="btn" id="btn-jump">&#10514;</div>
  </div>
  <div class="cluster right">
    <div class="btn small" id="btn-cloak">&#128123;</div>
    <div class="btn small" id="btn-morph">&#129504;</div>
    <div class="btn small" id="btn-gravity">&#128255;</div>
  </div>
</div>
<script>
/* ===== أدوات مساعدة عامة ===== */
function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
function lerp(a, b, t) { return a + (b - a) * t; }
function rand(a, b) { return a + Math.random() * (b - a); }
function aabb(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x &&
         a.y < b.y + b.h && a.y + a.h > b.y;
}
function angDiff(a, b) {
  var d = a - b;
  while (d > Math.PI) d -= 2 * Math.PI;
  while (d < -Math.PI) d += 2 * Math.PI;
  return d;
}
function dist2(ax, ay, bx, by) {
  var dx = ax - bx, dy = ay - by;
  return dx * dx + dy * dy;
}
function roundRect(ctx, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
var _actx = null;
function audio() {
  if (!_actx) {
    try { _actx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch (e) { _actx = null; }
  }
  if (_actx && _actx.state === 'suspended') { _actx.resume(); }
  return _actx;
}
function beep(freq, dur, type, vol) {
  var a = audio(); if (!a) return;
  var o = a.createOscillator(), g = a.createGain();
  o.type = type || 'square'; o.frequency.value = freq;
  g.gain.value = vol || 0.07;
  o.connect(g); g.connect(a.destination);
  var t = a.currentTime;
  o.start(t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.stop(t + dur + 0.02);
}
function sfx(name) {
  switch (name) {
    case 'jump':    beep(420, 0.12, 'square', 0.05); break;
    case 'collect': beep(660, 0.10, 'triangle', 0.08); beep(880, 0.12, 'triangle', 0.06); break;
    case 'cell':    beep(520, 0.12, 'sine', 0.07); break;
    case 'cloak':   beep(300, 0.18, 'sine', 0.05); break;
    case 'morph':   beep(240, 0.20, 'sawtooth', 0.05); break;
    case 'gravity': beep(180, 0.25, 'sawtooth', 0.06); break;
    case 'caught':  beep(140, 0.40, 'sawtooth', 0.09); break;
    case 'win':
      beep(523, 0.15, 'triangle', 0.08);
      setTimeout(function () { beep(659, 0.15, 'triangle', 0.08); }, 150);
      setTimeout(function () { beep(784, 0.32, 'triangle', 0.08); }, 320);
      break;
  }
}
function wrapText(ctx, text, x, y, maxW, lh) {
  var words = text.split(' '), line = '', yy = y;
  for (var i = 0; i < words.length; i++) {
    var test = line ? line + ' ' + words[i] : words[i];
    if (ctx.measureText(test).width > maxW && line) {
      ctx.fillText(line, x, yy); line = words[i]; yy += lh;
    } else { line = test; }
  }
  ctx.fillText(line, x, yy);
}

/* ===== مدير الإدخال: لمس + لوحة مفاتيح ===== */
class Input {
  constructor() {
    this.left = false; this.right = false; this.cloakHeld = false;
    this._jump = false; this._morph = false; this._gravity = false;
    this._bindKeyboard(); this._bindButtons();
  }
  _bindButton(id, onDown, onUp) {
    var el = document.getElementById(id); if (!el) return;
    var down = function (e) { e.preventDefault(); if (onDown) onDown(); };
    var up = function (e) { e.preventDefault(); if (onUp) onUp(); };
    el.addEventListener('pointerdown', down);
    el.addEventListener('pointerup', up);
    el.addEventListener('pointerleave', up);
    el.addEventListener('pointercancel', up);
  }
  _bindButtons() {
    var self = this;
    this._bindButton('btn-left',  function () { self.left = true; },  function () { self.left = false; });
    this._bindButton('btn-right', function () { self.right = true; }, function () { self.right = false; });
    this._bindButton('btn-jump',  function () { self._jump = true; }, null);
    this._bindButton('btn-cloak', function () { self.cloakHeld = true; }, function () { self.cloakHeld = false; });
    this._bindButton('btn-morph', function () { self._morph = true; }, null);
    this._bindButton('btn-gravity', function () { self._gravity = true; }, null);
  }
  _bindKeyboard() {
    var self = this;
    window.addEventListener('keydown', function (e) {
      switch (e.code) {
        case 'ArrowLeft': case 'KeyA': self.left = true; break;
        case 'ArrowRight': case 'KeyD': self.right = true; break;
        case 'Space': case 'ArrowUp': case 'KeyW': self._jump = true; break;
        case 'KeyJ': self.cloakHeld = true; break;
        case 'KeyK': self._morph = true; break;
        case 'KeyL': self._gravity = true; break;
      }
    });
    window.addEventListener('keyup', function (e) {
      switch (e.code) {
        case 'ArrowLeft': case 'KeyA': self.left = false; break;
        case 'ArrowRight': case 'KeyD': self.right = false; break;
        case 'KeyJ': self.cloakHeld = false; break;
      }
    });
  }
  consumeJump()    { var v = this._jump;    this._jump = false;    return v; }
  consumeMorph()   { var v = this._morph;   this._morph = false;   return v; }
  consumeGravity() { var v = this._gravity; this._gravity = false; return v; }
}

/* ===== الكيانات ===== */
class Player {
  constructor(x, y) {
    this.x = x; this.y = y; this.w = 34; this.h = 42;
    this.vx = 0; this.vy = 0; this.speed = 250; this.jump = -560;
    this.onGround = false; this.gravityDir = 1;
    this.energy = 100; this.maxEnergy = 100;
    this.cloaked = false; this.morphed = false; this.facing = 1; this.animT = 0;
  }
  get hidden() { return this.cloaked || this.morphed; }
  aabb() { return { x: this.x, y: this.y, w: this.w, h: this.h }; }
  center() { return { x: this.x + this.w / 2, y: this.y + this.h / 2 }; }
  update(dt, input, level, game) {
    this.cloaked = input.cloakHeld && this.energy > 0 && !this.morphed;
    if (input.consumeMorph()) {
      if (this.morphed) { this.morphed = false; }
      else if (this.energy > 10) { this.morphed = true; this.vx = 0; sfx('morph'); }
    }
    if (input.consumeGravity()) {
      if (this.gravityDir === 1 && this.energy > 15) { this.gravityDir = -1; sfx('gravity'); }
      else if (this.gravityDir === -1) { this.gravityDir = 1; sfx('gravity'); }
    }
    var move = 0;
    if (!this.morphed) {
      if (input.left) move -= 1;
      if (input.right) move += 1;
    }
    this.vx = move * this.speed;
    if (move !== 0) this.facing = move;
    var G = 1500;
    this.vy += G * this.gravityDir * dt;
    var MAXFALL = 700;
    this.vy = clamp(this.vy, -MAXFALL, MAXFALL);
    if (input.consumeJump() && this.onGround && !this.morphed) {
      this.vy = this.jump * this.gravityDir;
      this.onGround = false; sfx('jump');
    }
    this.x += this.vx * dt;
    var i, p;
    for (i = 0; i < level.platforms.length; i++) {
      p = level.platforms[i];
      if (aabb(this.aabb(), p)) {
        if (this.vx > 0) this.x = p.x - this.w;
        else if (this.vx < 0) this.x = p.x + p.w;
        this.vx = 0;
      }
    }
    this.y += this.vy * dt;
    this.onGround = false;
    for (i = 0; i < level.platforms.length; i++) {
      p = level.platforms[i];
      if (aabb(this.aabb(), p)) {
        if (this.vy * this.gravityDir > 0) {
          this.y = this.gravityDir > 0 ? p.y - this.h : p.y + p.h;
          this.vy = 0; this.onGround = true;
        } else if (this.vy * this.gravityDir < 0) {
          this.y = this.gravityDir > 0 ? p.y + p.h : p.y - this.h;
          this.vy = 0;
        }
      }
    }
    var drain = 0;
    if (this.cloaked) drain += 22;
    if (this.morphed) drain += 10;
    if (this.gravityDir === -1) drain += 8;
    if (drain > 0) {
      this.energy = Math.max(0, this.energy - drain * dt);
      if (this.energy === 0) { this.cloaked = false; if (this.gravityDir === -1) this.gravityDir = 1; }
    } else {
      this.energy = Math.min(this.maxEnergy, this.energy + 14 * dt);
    }
    this.animT += dt;
    if (this.y > level.worldH + 220 || this.y < -340) game.respawn();
  }
}
class Human {
  constructor(x, y, range) {
    this.x = x; this.y = y; this.w = 30; this.h = 54;
    this.dir = 1; this.patrolMin = x - range; this.patrolMax = x + range;
    this.speed = 70; this.visionRange = 270; this.fov = 0.62;
    this.state = 'patrol'; this.chaseT = 0; this.seeing = false;
  }
  update(dt, player) {
    if (this.state === 'chase') {
      var dx = (player.x + player.w / 2) - (this.x + this.w / 2);
      this.dir = Math.sign(dx) || this.dir;
      this.x += this.dir * this.speed * 1.7 * dt;
      this.chaseT -= dt;
      if (this.chaseT <= 0) this.state = 'patrol';
    } else {
      this.x += this.dir * this.speed * dt;
      if (this.x < this.patrolMin) { this.x = this.patrolMin; this.dir = 1; }
      if (this.x > this.patrolMax) { this.x = this.patrolMax; this.dir = -1; }
    }
    this.seeing = false;
    if (!player.hidden) {
      var ex = this.x + this.w / 2, ey = this.y + 12;
      var pc = player.center();
      var d = Math.hypot(pc.x - ex, pc.y - ey);
      if (d < this.visionRange) {
        var ang = Math.atan2(pc.y - ey, pc.x - ex);
        var face = this.dir > 0 ? 0 : Math.PI;
        if (Math.abs(angDiff(ang, face)) < this.fov) this.seeing = true;
      }
    }
    if (this.seeing) { this.state = 'chase'; this.chaseT = 1.6; }
  }
}
class Cam {
  constructor(x, y, baseAngle, range) {
    this.x = x; this.y = y; this.baseAngle = baseAngle; this.range = range;
    this.fov = 0.5; this.t = Math.random() * 6; this.angle = baseAngle; this.seeing = false;
  }
  update(dt, player) {
    this.t += dt;
    this.angle = this.baseAngle + Math.sin(this.t * 0.8) * 0.6;
    this.seeing = false;
    if (!player.hidden) {
      var pc = player.center();
      var d = Math.hypot(pc.x - this.x, pc.y - this.y);
      if (d < this.range) {
        var ang = Math.atan2(pc.y - this.y, pc.x - this.x);
        if (Math.abs(angDiff(ang, this.angle)) < this.fov) this.seeing = true;
      }
    }
  }
}
class Part {
  constructor(x, y) { this.x = x; this.y = y; this.r = 18; this.collected = false; this.t = Math.random() * 6; }
  update(dt) { this.t += dt; }
}
class EnergyCell {
  constructor(x, y) { this.x = x; this.y = y; this.r = 15; this.taken = false; this.t = Math.random() * 6; }
  update(dt) { this.t += dt; }
}

/* ===== بناء المرحلة ===== */
function buildLevel(H) {
  var groundTop = H - 90, W = 3900, plats = [];
  function ground(x0, x1) { plats.push({ x: x0, y: groundTop, w: x1 - x0, h: H - groundTop }); }
  ground(0, 760); ground(900, 1700); ground(1850, 2720); ground(2880, W);
  plats.push({ x: 520,  y: groundTop - 100, w: 170, h: 40 });
  plats.push({ x: 1010, y: groundTop - 200, w: 170, h: 40 });
  plats.push({ x: 1380, y: groundTop - 300, w: 170, h: 40 });
  plats.push({ x: 2240, y: groundTop - 320, w: 180, h: 40 });
  plats.push({ x: 3000, y: groundTop - 180, w: 210, h: 40 });
  plats.push({ x: 1240, y: 120, w: 210, h: 40 });
  plats.push({ x: 2380, y: 120, w: 230, h: 40 });
  var parts = [
    new Part(600,  groundTop - 150),
    new Part(1090, groundTop - 250),
    new Part(1450, groundTop - 350),
    new Part(2310, groundTop - 370),
    new Part(1330, 165),
    new Part(3080, groundTop - 230)
  ];
  var humans = [
    new Human(380,  groundTop - 54, 90),
    new Human(1250, groundTop - 54, 110),
    new Human(2050, groundTop - 54, 120),
    new Human(3050, groundTop - 54, 120)
  ];
  var cams = [
    new Cam(1000, 64, Math.PI / 2, 320),
    new Cam(2520, 64, Math.PI / 2, 340)
  ];
  var cells = [
    new EnergyCell(600,  groundTop - 140),
    new EnergyCell(2310, groundTop - 360),
    new EnergyCell(3080, groundTop - 220)
  ];
  return {
    worldW: W, worldH: H, groundTop: groundTop,
    platforms: plats, parts: parts, humans: humans, cams: cams, cells: cells,
    spawn: { x: 60, y: groundTop - 50 },
    ship: { x: 3520, y: groundTop - 130 }
  };
}

/* ===== اللعبة الرئيسية ===== */
class Game {
  constructor(canvas) {
    this.canvas = canvas; this.ctx = canvas.getContext('2d');
    this.input = new Input(); this.state = 'title';
    this.W = 0; this.H = 0; this.dpr = 1;
    this.lives = 3; this.score = 0; this.detection = 0; this.alertT = 0;
    this.time = 0; this.collected = 0; this.totalParts = 0;
    this.player = null; this.level = null;
    this._resize();
    var self = this;
    window.addEventListener('resize', function () { self._resize(); });
    this.canvas.addEventListener('pointerdown', function () { self._onTap(); });
    this.last = performance.now();
    requestAnimationFrame(function (t) { self._frame(t); });
  }
  _resize() {
    var w = window.innerWidth, h = window.innerHeight;
    this.dpr = Math.min(window.devicePixelRatio || 1, 2);
    this.canvas.width = Math.floor(w * this.dpr);
    this.canvas.height = Math.floor(h * this.dpr);
    this.canvas.style.width = w + 'px'; this.canvas.style.height = h + 'px';
    if (!this.H) { this.H = h; this.W = w; this._build(); }
    else { this.W = w; }
  }
  _build() {
    this.level = buildLevel(this.H);
    this.totalParts = this.level.parts.length;
    this.player = new Player(this.level.spawn.x, this.level.spawn.y);
  }
  startGame() {
    audio(); this._build();
    this.lives = 3; this.score = 0; this.detection = 0;
    this.time = 0; this.collected = 0; this.state = 'play';
  }
  respawn() {
    sfx('caught'); this.lives--;
    if (this.lives <= 0) { this.state = 'lose'; return; }
    this.detection = 0;
    this.player.x = this.level.spawn.x; this.player.y = this.level.spawn.y;
    this.player.vx = 0; this.player.vy = 0; this.player.gravityDir = 1;
    this.player.energy = this.player.maxEnergy;
    this.player.morphed = false; this.player.cloaked = false;
  }
  _onTap() { audio(); if (this.state === 'title' || this.state === 'win' || this.state === 'lose') this.startGame(); }
  _frame(now) {
    var dt = (now - this.last) / 1000; this.last = now;
    if (dt > 0.033) dt = 0.033;
    this.update(dt); this.render();
    var self = this; requestAnimationFrame(function (t) { self._frame(t); });
  }
  update(dt) {
    this.time += dt;
    if (this.state !== 'play') return;
    var pl = this.player, L = this.level;
    pl.update(dt, this.input, L, this);
    var i;
    for (i = 0; i < L.humans.length; i++) L.humans[i].update(dt, pl);
    for (i = 0; i < L.cams.length; i++) L.cams[i].update(dt, pl);
    var pc = pl.center();
    for (i = 0; i < L.parts.length; i++) {
      var p = L.parts[i];
      if (!p.collected) {
        p.update(dt);
        if (dist2(pc.x, pc.y, p.x, p.y) < (p.r + 22) * (p.r + 22)) {
          p.collected = true; this.collected++; this.score += 100; sfx('collect');
        }
      }
    }
    for (i = 0; i < L.cells.length; i++) {
      var c = L.cells[i];
      if (!c.taken) {
        c.update(dt);
        if (dist2(pc.x, pc.y, c.x, c.y) < (c.r + 22) * (c.r + 22)) {
          c.taken = true;
          pl.energy = Math.min(pl.maxEnergy, pl.energy + 45);
          this.score += 20; sfx('cell');
        }
      }
    }
    var spotted = false;
    for (i = 0; i < L.humans.length; i++) if (L.humans[i].seeing) spotted = true;
    for (i = 0; i < L.cams.length; i++) if (L.cams[i].seeing) spotted = true;
    if (spotted) { this.detection = Math.min(100, this.detection + 55 * dt); this.alertT = 0.25; }
    else { this.detection = Math.max(0, this.detection - 30 * dt); }
    if (this.alertT > 0) this.alertT -= dt;
    if (this.detection >= 100) { this.respawn(); return; }
    if (this.collected >= this.totalParts) { this.state = 'win'; sfx('win'); }
  }
  render() {
    var ctx = this.ctx;
    ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    ctx.clearRect(0, 0, this.W, this.H);
    this._drawBg(ctx);
    if (this.state === 'title') { this._drawTitle(ctx); return; }
    var camX = clamp(this.player.x + this.player.w / 2 - this.W * 0.42, 0, Math.max(0, this.level.worldW - this.W));
    ctx.save(); ctx.translate(-camX, 0); this._drawWorld(ctx); ctx.restore();
    this._drawHud(ctx);
    if (this.state === 'win') this._drawWin(ctx);
    if (this.state === 'lose') this._drawLose(ctx);
  }
  _drawBg(ctx) {
    var g = ctx.createLinearGradient(0, 0, 0, this.H);
    g.addColorStop(0, '#0a1030'); g.addColorStop(0.6, '#161a3a'); g.addColorStop(1, '#241b3a');
    ctx.fillStyle = g; ctx.fillRect(0, 0, this.W, this.H);
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    for (var i = 0; i < 70; i++) {
      var sx = (i * 137.5) % this.W, sy = (i * 89.3) % (this.H * 0.6);
      var tw = 0.4 + 0.6 * Math.abs(Math.sin(this.time * 2 + i));
      ctx.globalAlpha = tw * 0.8; ctx.fillRect(sx, sy, 2, 2);
    }
    ctx.globalAlpha = 1;
    var off = (this.player ? this.player.x : 0) * 0.15;
    ctx.fillStyle = 'rgba(40,30,70,0.6)';
    for (var k = -1; k < this.W / 200 + 2; k++) {
      var hx = k * 200 - (off % 200);
      ctx.beginPath(); ctx.arc(hx + 100, this.H, 170, Math.PI, 0); ctx.fill();
    }
  }
  _drawWorld(ctx) {
    var L = this.level, i, p;
    for (i = 0; i < L.platforms.length; i++) {
      p = L.platforms[i];
      ctx.fillStyle = '#23304d'; roundRect(ctx, p.x, p.y, p.w, p.h, 6); ctx.fill();
      ctx.fillStyle = '#3a7d44'; ctx.fillRect(p.x, p.y, p.w, 8);
    }
    this._drawShip(ctx, L.ship.x, L.ship.y);
    for (i = 0; i < L.parts.length; i++) {
      var pt = L.parts[i]; if (pt.collected) continue;
      var yy = pt.y + Math.sin(pt.t * 2) * 4;
      ctx.save(); ctx.translate(pt.x, yy); ctx.rotate(pt.t * 0.8);
      ctx.fillStyle = '#ffd24a'; ctx.shadowColor = '#ffd24a'; ctx.shadowBlur = 14;
      ctx.beginPath(); ctx.arc(0, 0, pt.r, 0, 7); ctx.fill();
      ctx.shadowBlur = 0; ctx.fillStyle = '#7a5a00';
      for (var s = 0; s < 6; s++) {
        var a = s / 6 * Math.PI * 2;
        ctx.fillRect(Math.cos(a) * pt.r - 2, Math.sin(a) * pt.r - 2, 4, 10);
      }
      ctx.restore();
    }
    for (i = 0; i < L.cells.length; i++) {
      var c = L.cells[i]; if (c.taken) continue;
      var cy = c.y + Math.sin(c.t * 2.4) * 4;
      ctx.save(); ctx.translate(c.x, cy);
      ctx.fillStyle = '#39d0ff'; ctx.shadowColor = '#39d0ff'; ctx.shadowBlur = 12;
      ctx.beginPath(); ctx.moveTo(0, -c.r); ctx.lineTo(c.r, 0); ctx.lineTo(0, c.r); ctx.lineTo(-c.r, 0); ctx.closePath(); ctx.fill();
      ctx.restore();
    }
    for (i = 0; i < L.humans.length; i++) this._drawHuman(ctx, L.humans[i]);
    for (i = 0; i < L.cams.length; i++) this._drawCam(ctx, L.cams[i]);
    this._drawPlayer(ctx);
  }
  _drawShip(ctx, x, y) {
    ctx.save(); ctx.translate(x, y);
    ctx.fillStyle = '#9aa7c7'; ctx.beginPath(); ctx.ellipse(0, 30, 72, 22, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#dfe6f5'; ctx.beginPath(); ctx.ellipse(0, 18, 34, 20, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#ffd24a';
    for (var i = -2; i <= 2; i++) { ctx.beginPath(); ctx.arc(i * 22, 30, 4, 0, 7); ctx.fill(); }
    ctx.restore();
  }
  _drawHuman(ctx, h) {
    var ex = h.x + h.w / 2, ey = h.y + 12;
    var base = h.dir > 0 ? 0 : Math.PI, a0 = base - h.fov, a1 = base + h.fov;
    ctx.fillStyle = h.seeing ? 'rgba(255,60,60,0.22)' : 'rgba(255,200,80,0.10)';
    ctx.beginPath(); ctx.moveTo(ex, ey); ctx.arc(ex, ey, h.visionRange, a0, a1); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#3b5bdb'; ctx.fillRect(h.x + 4, h.y + 18, h.w - 8, h.h - 26);
    ctx.fillStyle = '#ffd9a0'; ctx.beginPath(); ctx.arc(ex, h.y + 12, 9, 0, 7); ctx.fill();
    ctx.fillStyle = '#222'; ctx.fillRect(h.x + (h.dir > 0 ? h.w - 14 : 6), h.y + 22, 8, 10);
  }
  _drawCam(ctx, c) {
    var a0 = c.angle - c.fov, a1 = c.angle + c.fov;
    ctx.fillStyle = c.seeing ? 'rgba(255,60,60,0.22)' : 'rgba(120,200,255,0.12)';
    ctx.beginPath(); ctx.moveTo(c.x, c.y); ctx.arc(c.x, c.y, c.range, a0, a1); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#444'; ctx.fillRect(c.x - 12, c.y - 8, 24, 16);
    ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(c.x, c.y, 6, 0, 7); ctx.fill();
    ctx.strokeStyle = c.seeing ? '#ff5050' : '#88c0ff'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(c.x, c.y); ctx.lineTo(c.x + Math.cos(c.angle) * 14, c.y + Math.sin(c.angle) * 14); ctx.stroke();
  }
  _drawPlayer(ctx) {
    var pl = this.player; ctx.save();
    if (pl.morphed) {
      ctx.fillStyle = '#a9743b'; ctx.fillRect(pl.x, pl.y, pl.w, pl.h);
      ctx.strokeStyle = '#6e4a22'; ctx.lineWidth = 3; ctx.strokeRect(pl.x + 2, pl.y + 2, pl.w - 4, pl.h - 4);
      ctx.beginPath();
      ctx.moveTo(pl.x, pl.y); ctx.lineTo(pl.x + pl.w, pl.y + pl.h);
      ctx.moveTo(pl.x + pl.w, pl.y); ctx.lineTo(pl.x, pl.y + pl.h); ctx.stroke();
    } else {
      this._drawAlien(ctx, pl.x, pl.y, pl.w, pl.h, pl.facing, pl.animT, pl.cloaked);
    }
    if (pl.gravityDir === -1) { ctx.fillStyle = 'rgba(120,255,200,0.9)'; ctx.font = '14px sans-serif'; ctx.fillText('🌀', pl.x - 2, pl.y - 6); }
    ctx.restore();
  }
  _drawAlien(ctx, x, y, w, h, facing, t, cloaked) {
    ctx.save(); ctx.globalAlpha = cloaked ? 0.28 : 1;
    var cx = x + w / 2, cy = y + h / 2;
    ctx.fillStyle = '#7CFFB2'; ctx.beginPath(); ctx.ellipse(cx, cy + 4, w / 2, h / 2 - 2, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#bfffd9'; ctx.beginPath(); ctx.ellipse(cx, cy + 10, w / 3, h / 3, 0, 0, 7); ctx.fill();
    ctx.strokeStyle = '#7CFFB2'; ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(cx - 6, y + 4); ctx.lineTo(cx - 10, y - 8);
    ctx.moveTo(cx + 6, y + 4); ctx.lineTo(cx + 10, y - 8); ctx.stroke();
    ctx.fillStyle = '#ff7ce0'; ctx.beginPath(); ctx.arc(cx - 10, y - 9, 3, 0, 7); ctx.arc(cx + 10, y - 9, 3, 0, 7); ctx.fill();
    var ex = facing >= 0 ? 4 : -4;
    ctx.fillStyle = '#fff'; ctx.beginPath();
    ctx.ellipse(cx + ex - 6, cy - 2, 6, 8, 0, 0, 7);
    ctx.ellipse(cx + ex + 6, cy - 2, 6, 8, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#111'; ctx.beginPath();
    ctx.arc(cx + ex - 6 + facing * 2, cy - 1, 3, 0, 7);
    ctx.arc(cx + ex + 6 + facing * 2, cy - 1, 3, 0, 7); ctx.fill();
    ctx.restore();
  }
  _bar(ctx, x, y, w, h, frac, color, label) {
    frac = clamp(frac, 0, 1);
    ctx.fillStyle = 'rgba(255,255,255,0.15)'; roundRect(ctx, x, y, w, h, h / 2); ctx.fill();
    ctx.fillStyle = color; roundRect(ctx, x, y, w * frac, h, h / 2); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = '11px sans-serif'; ctx.fillText(label, x + 6, y + h - 3);
  }
  _drawHud(ctx) {
    ctx.fillStyle = 'rgba(8,12,28,0.55)'; ctx.fillRect(0, 0, this.W, 84);
    var pad = 12, y = 14, bw = this.W * 0.42;
    this._bar(ctx, pad, y, bw, 14, this.collected / this.totalParts, '#ffd24a', 'الإصلاح ' + this.collected + '/' + this.totalParts);
    this._bar(ctx, pad, y + 26, bw, 14, this.player.energy / this.player.maxEnergy, '#39d0ff', 'الطاقة');
    this._bar(ctx, pad, y + 52, bw, 14, this.detection / 100, this.detection > 60 ? '#ff5050' : '#ff9f43', 'الكشف');
    ctx.fillStyle = '#fff'; ctx.font = 'bold 16px sans-serif'; ctx.textAlign = 'right';
    ctx.fillText('النقاط: ' + this.score, this.W - pad, y + 14);
    ctx.fillText('المحاولات: ' + this.lives, this.W - pad, y + 40);
    ctx.textAlign = 'left';
    if (this.alertT > 0) { ctx.fillStyle = 'rgba(255,40,40,' + (0.3 + 0.3 * Math.sin(this.time * 30)) + ')'; ctx.fillRect(0, 0, this.W, 6); }
  }
  _drawTitle(ctx) {
    ctx.fillStyle = 'rgba(5,8,20,0.80)'; ctx.fillRect(0, 0, this.W, this.H);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#7CFFB2'; ctx.font = 'bold 46px sans-serif'; ctx.fillText('ZUGO', this.W / 2, this.H * 0.30);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 22px sans-serif'; ctx.fillText('الهروب الأخير 🛸', this.W / 2, this.H * 0.30 + 34);
    ctx.fillStyle = '#bcd'; ctx.font = '15px sans-serif';
    wrapText(ctx, 'تحطمت سفينة زوغو على الأرض! اجمع أجزاء السفينة الستة وتجنّب البشر والكاميرات، واستخدم قدراتك الخارقة لتعود إلى كوكبه.', this.W / 2, this.H * 0.45, this.W * 0.82, 22);
    var blink = 0.5 + 0.5 * Math.sin(this.time * 4);
    ctx.globalAlpha = blink; ctx.fillStyle = '#ffd24a'; ctx.font = 'bold 22px sans-serif';
    ctx.fillText('انقر للبدء', this.W / 2, this.H * 0.70); ctx.globalAlpha = 1; ctx.textAlign = 'left';
  }
  _drawWin(ctx) {
    ctx.fillStyle = 'rgba(5,20,10,0.82)'; ctx.fillRect(0, 0, this.W, this.H);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#7CFFB2'; ctx.font = 'bold 30px sans-serif'; ctx.fillText('تم إصلاح السفينة! 🛸', this.W / 2, this.H * 0.38);
    ctx.fillStyle = '#fff'; ctx.font = '17px sans-serif'; ctx.fillText('عاد زوغو إلى كوكبه بأمان', this.W / 2, this.H * 0.38 + 32);
    ctx.fillStyle = '#ffd24a'; ctx.font = 'bold 20px sans-serif'; ctx.fillText('النقاط: ' + this.score, this.W / 2, this.H * 0.55);
    var blink = 0.5 + 0.5 * Math.sin(this.time * 4);
    ctx.globalAlpha = blink; ctx.fillStyle = '#fff'; ctx.font = 'bold 20px sans-serif';
    ctx.fillText('انقر للعبة جديدة', this.W / 2, this.H * 0.68); ctx.globalAlpha = 1; ctx.textAlign = 'left';
  }
  _drawLose(ctx) {
    ctx.fillStyle = 'rgba(30,5,10,0.82)'; ctx.fillRect(0, 0, this.W, this.H);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ff6b6b'; ctx.font = 'bold 30px sans-serif'; ctx.fillText('تم القبض عليك! 🚨', this.W / 2, this.H * 0.40);
    ctx.fillStyle = '#fff'; ctx.font = '17px sans-serif'; ctx.fillText('اكتشفك البشر قبل إصلاح السفينة', this.W / 2, this.H * 0.40 + 32);
    ctx.fillStyle = '#ffd24a'; ctx.font = 'bold 20px sans-serif'; ctx.fillText('النقاط: ' + this.score, this.W / 2, this.H * 0.55);
    var blink = 0.5 + 0.5 * Math.sin(this.time * 4);
    ctx.globalAlpha = blink; ctx.fillStyle = '#fff'; ctx.font = 'bold 20px sans-serif';
    ctx.fillText('انقر للمحاولة مجددًا', this.W / 2, this.H * 0.68); ctx.globalAlpha = 1; ctx.textAlign = 'left';
  }
}

window.addEventListener('load', function () {
  var g = new Game(document.getElementById('game'));
  window.__game = g;
});
</script>
